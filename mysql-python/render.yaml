services:
  - type: web
    name: seat-reservation-api
    runtime: docker
    plan: free
    healthCheckPath: /ready
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: seat_reservation
