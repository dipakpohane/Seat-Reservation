services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: seat_reservation
      MYSQL_USER: seat_reservation
      MYSQL_PASSWORD: seat-local-password
      MYSQL_ROOT_PASSWORD: seat-local-root-password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-pseat-local-root-password"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build: .
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: seat_reservation
      MYSQL_PASSWORD: seat-local-password
      MYSQL_DATABASE: seat_reservation
      AUTH_SECRET: local-development-secret-change-me
      PUBLIC_BASE_URL: http://127.0.0.1:8000
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
